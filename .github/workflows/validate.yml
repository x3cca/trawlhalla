name: Validate

on:
  push:
  pull_request:
    paths-ignore:
      - "upstream.lock.json"
      - "upstream/**"
      - "vendor/bpc/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize Trawl upstream
        run: git submodule update --init --recursive upstream/trawl
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
