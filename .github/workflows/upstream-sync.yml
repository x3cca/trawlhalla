name: Upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstreams
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Find pending update PRs
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "bpc=false" >> "${GITHUB_OUTPUT}"
          echo "trawl=false" >> "${GITHUB_OUTPUT}"
          heads="$(gh pr list --state open --limit 100 --json headRefName,mergeStateStatus --jq '.[] | select(.mergeStateStatus != "DIRTY") | .headRefName')"
          for upstream in bpc trawl; do
            if grep -Eq "^sync/${upstream}-" <<< "${heads}"; then
              echo "${upstream}=true" >> "${GITHUB_OUTPUT}"
              echo "Pending ${upstream} update PR found"
            fi
          done
      - name: Sync BPC Firefox extension
        id: bpc
        if: steps.pending.outputs.bpc != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "SYNC_TARGET=bpc" >> "${GITHUB_ENV}"
          git submodule update --init --recursive upstream/trawl
          bun run sync:bpc
          bun run verify
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Sync Trawl
        id: trawl
        if: >-
          steps.pending.outputs.trawl != 'true' &&
          (steps.pending.outputs.bpc == 'true' || steps.bpc.outputs.changed != 'true')
        shell: bash
        run: |
          set -euo pipefail
          echo "SYNC_TARGET=trawl" >> "${GITHUB_ENV}"
          bun run sync:trawl
          bun run verify
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Open separate update PR
        if: steps.bpc.outputs.changed == 'true' || steps.trawl.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BPC_CHANGED: ${{ steps.bpc.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BPC_CHANGED}" = "true" ]; then upstream="bpc"; else upstream="trawl"; fi
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="sync/${upstream}-${stamp}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream.lock.json
          if [ "$upstream" = "trawl" ]; then
            git add upstream/trawl
          else
            git add upstream/bpc-uploads vendor/bpc
          fi
          git commit -m "chore: sync ${upstream} upstream"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync ${upstream} upstream" \
            --body "Automated single-upstream update. Verification passed; review the lock, permission, and patch changes before merging."
      - name: Record failed sync for the agent queue
        if: failure()
        shell: bash
        run: |
          {
            echo "## ${SYNC_TARGET:-Upstream} sync needs integration work"
            echo
            echo "The automated ${SYNC_TARGET:-upstream} update did not pass its integration gates."
            echo "Use this failed job and its logs as the maintenance queue item; no update PR was opened."
            echo
            echo '```text'
            git status --short
            git diff -- upstream.lock.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
