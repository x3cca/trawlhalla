name: Upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: trawl
            label: Trawl
          - upstream: bpc
            label: BPC Firefox extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6f # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Advance one upstream
        run: bun run sync:${{ matrix.upstream }}
      - name: Verify integration
        run: bun run verify
      - name: Open separate update PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.upstream }}
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No ${UPSTREAM} update"
            exit 0
          fi
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="sync/${UPSTREAM}-${stamp}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream.lock.json
          if [ "$UPSTREAM" = "trawl" ]; then
            git add upstream/trawl
          else
            git add upstream/bpc-uploads
          fi
          git commit -m "chore: sync ${UPSTREAM} upstream"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync ${UPSTREAM} upstream" \
            --body "Automated single-upstream update. Verification passed; review the lock, permission, and patch changes before merging."
      - name: Record failed sync for the agent queue
        if: failure()
        env:
          UPSTREAM: ${{ matrix.upstream }}
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          {
            echo "## ${LABEL} sync needs integration work"
            echo
            echo "The automated ${UPSTREAM} update did not pass its integration gates."
            echo "Use this failed job and its logs as the maintenance queue item; no update PR was opened."
            echo
            echo '```text'
            git status --short
            git diff -- upstream.lock.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
