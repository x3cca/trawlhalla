name: Upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1,4"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        upstream: [trawl, bpc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6f # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Advance one upstream
        run: bun run sync:${{ matrix.upstream }}
      - name: Verify integration
        run: bun run verify
      - name: Open separate update PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.upstream }}
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No ${UPSTREAM} update"
            exit 0
          fi
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="sync/${UPSTREAM}-${stamp}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream.lock.json
          if [ "$UPSTREAM" = "trawl" ]; then
            git add upstream/trawl
          else
            git add upstream/bpc-uploads
          fi
          git commit -m "chore: sync ${UPSTREAM} upstream"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync ${UPSTREAM} upstream" \
            --body "Automated single-upstream update. Verification passed; review the lock, permission, and patch changes before merging."
